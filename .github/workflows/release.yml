# Strata Link's ready-made engines: the zips setup.py downloads (tools/make_release.py), built here instead of by hand.
#
#   a tag v<LINK_VERSION> (v0.1.45-link.1):   build every zip, then a DRAFT release with them and SHA256.txt; the
#                                             owner reads it over and publishes it
#   a push to ci/**:                          build every zip, as workflow artifacts only (no release)
#   Run workflow (workflow_dispatch):         the same as the ref it is run on
#
# One job per program (the engine, the image encoder) per zip, so no job comes near the 6 h limit; the pack job zips
# them.  The CUDA versions are the ones whose cuBLAS setup.py installs from pip (CUDA_WHEELS / CUDA12_WHEELS): 13.0
# Update 1 (cuBLAS 13.0.2.14) and 12.9 Update 1 (cuBLAS 12.9.1.4).  The archs are upstream's releases' (cuobjdump
# of the 0.1.44.1 zips).  The AMD (HIP) zip is not built here: tools/hip/build_windows.bat.  The Linux zip is built on
# Rocky Linux 8 (glibc 2.28) with libstdc++ linked in, and run on the oldest distributions before a release.  The
# engine links OpenSSL statically (the remote stage's TLS 1.3): vcpkg's x64-windows-static on Windows (vcpkg pinned to
# a release), OpenSSL 3.5 LTS built from its release tarball (sha256-pinned) on Rocky Linux 8; a release build without
# it stops at configure.
#
# LINK_VERSION (<CMakeLists.txt's version>-link.<n>): bump n only when the engine binary changes (its sources, its
# build, the toolkit); an upstream merge that changes CMakeLists.txt's version starts again at <new version>-link.1.
# Every installed engine older than it is replaced (~150 MB each), so a setup or serve change alone does not bump it.
# setup.py's LINK_REQUIRED, the oldest release setup still installs, moves only when setup or serve needs a newer
# engine.  Publish the release before the commit that bumps LINK_VERSION reaches main: until then setup installs or
# keeps the latest (older) release and asks for the tag again a day later.  An upstream merge that raises setup.py's
# MIN_ENGINE leaves no such fallback (every older release is below it: a fresh install compiles, an installed engine
# is downloaded again on every start), so that release is tagged from the merge branch, and main moves once it is out.
name: release

on:
  push:
    tags: ["v*-link.*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: LINK_VERSION
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      link: ${{ steps.v.outputs.link }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: LINK_VERSION is this engine's version, and the tag's
        run: |
          link=$(python3 -c "import setup; print(setup.link_version())")
          engine=$(python3 -c "import setup; print(setup.source_version())")
          if ! printf '%s' "$link" | grep -Eqx '[0-9.]+-link\.[0-9]+' || [ "${link%-link.*}" != "$engine" ]; then
            echo "::error::LINK_VERSION is '$link'; CMakeLists.txt's version is $engine: it must be $engine-link.<n>"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$link" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, LINK_VERSION says v$link"; exit 1
          fi
          echo "link=$link" >> "$GITHUB_OUTPUT"
          echo "Strata Link $link (engine $engine)"

  windows:
    name: windows ${{ matrix.zip }} ${{ matrix.part }}
    needs: version
    runs-on: windows-2022
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {zip: cuda13, part: engine, cuda: "13.0.1", archs: "75-real;86-real;89-real;120", defs: ""}
          # the encoder as upstream's: the static CUDA runtime and no driver-API memory pool (it imports cuBLAS alone)
          - {zip: cuda13, part: vision, cuda: "13.0.1", archs: "75-real;86-real;89-real;120",
             defs: "-D GGML_STATIC=ON -D GGML_CUDA_NO_VMM=ON"}
          # the experimental Pascal / Volta engine (setup.py engine_defs: STRATA_EXPERIMENTAL_SM60 for every CUDA 12 one)
          - {zip: cuda12, part: engine, cuda: "12.9.1", archs: "60-real;61-real;70-real;75-real;80-real;86-real;89",
             defs: "-D STRATA_EXPERIMENTAL_SM60=ON"}
          - {zip: cuda12, part: vision, cuda: "12.9.1", archs: "60-real;61-real;70-real;75-real;80-real;86-real;89",
             defs: ""}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: cmake and ninja (requirements-build.txt's)
        run: python -m pip install $(grep -E '^(cmake|ninja)==' requirements-build.txt | tr -d '\r')
      - id: pins
        run: |
          echo "llama=$(python -c 'import setup; print(setup.LLAMA_CPP_COMMIT)')" >> "$GITHUB_OUTPUT"
          echo "CUDA_ROOT=$RUNNER_TEMP\\cuda-${{ matrix.cuda }}" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cuda-cache
        with:
          path: ${{ env.CUDA_ROOT }}
          key: cuda-redist-windows-${{ matrix.cuda }}-${{ matrix.zip }}-${{ hashFiles('.github/scripts/cuda_redist.py') }}
      - name: CUDA ${{ matrix.cuda }} (NVIDIA's redistributable archives)
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        run: |
          parts="cuda_nvcc cuda_cudart libcublas cuda_cccl"
          case "${{ matrix.cuda }}" in 13.*) parts="$parts cuda_crt libnvvm" ;; esac   # separate packages since 13.0
          python .github/scripts/cuda_redist.py --version "${{ matrix.cuda }}" --dest "$CUDA_ROOT" $parts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/llama.cpp
          key: llama.cpp-${{ steps.pins.outputs.llama }}-windows
      - name: llama.cpp at setup.py's commit
        run: python -c "import setup; setup.get_llama_cpp()"
      # the engine's remote stage is TLS 1.3, and a release build (STRATA_PORTABLE) links OpenSSL statically
      # (CMakeLists.txt strata_stage_tls): vcpkg's x64-windows-static, the static C runtime as the engine's (/MT), from
      # a vcpkg checkout pinned to its 2026.10.16 release (not the runner's, which moves with the image), so the
      # OpenSSL port is a known one (3.6.5#2 at that commit); `vcpkg list` prints it into the log
      - name: OpenSSL, static, for the engine (vcpkg 2026.10.16, x64-windows-static)
        if: matrix.part == 'engine'
        run: |
          git clone -q --filter=tree:0 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout -q 9eec002df1cd109f8f104cd966a763daf9751489
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" install openssl:x64-windows-static
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" list openssl
          echo "OPENSSL_ROOT=$(cygpath -m "$RUNNER_TEMP")/vcpkg/installed/x64-windows-static" >> "$GITHUB_ENV"
      - name: build ${{ matrix.part }}
        run: >-
          python .github/scripts/build_release.py ${{ matrix.part }} --build build --cuda "$CUDA_ROOT"
          --llama third_party/llama.cpp --archs "${{ matrix.archs }}" ${{ matrix.defs }}
          ${{ matrix.part == 'engine' && '-D "OPENSSL_ROOT_DIR=$OPENSSL_ROOT"' || '' }}
      - name: what it imports (the pip wheels' CUDA libraries, the driver, Windows)
        run: |
          python -m pip install --disable-pip-version-check -q pefile==2024.8.26
          ls -l build/*.exe build/*.dll build/bin/*.exe 2>/dev/null || true
          python .github/scripts/check_imports.py build/strata.exe build/strata_kq.dll build/bin/strata-vision.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows-${{ matrix.zip }}-${{ matrix.part }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/strata.exe
            build/strata_kq.dll
            build/bin/strata-vision.exe
            build/CMakeCache.txt
            build/CMakeFiles/*/CMakeCUDACompiler.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.part == 'engine'
        with:
          name: pdb-windows-${{ matrix.zip }}
          retention-days: 90
          path: |
            build/strata.pdb
            build/strata_kq.pdb

  linux:
    name: linux cuda13 ${{ matrix.part }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    # Rocky Linux 8 (glibc 2.28) with gcc-toolset-13, libstdc++ and libgcc linked in (LDFLAGS, CMake's initial
    # CMAKE_EXE/SHARED_LINKER_FLAGS): the programs need glibc 2.28 and nothing of the system's C++ runtime, so they run
    # on RHEL 8, Debian 10 and Ubuntu 20.04 and newer (the linux-floor job runs them there).  --as-needed as Ubuntu's
    # gcc has it: CMakeLists.txt links CUDA::cuda_driver, which the engine does not call (it starts without libcuda)
    container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
    env:
      CC: /opt/rh/gcc-toolset-13/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-13/root/usr/bin/g++
      CUDAHOSTCXX: /opt/rh/gcc-toolset-13/root/usr/bin/g++
      LDFLAGS: -static-libstdc++ -static-libgcc -Wl,--as-needed
    strategy:
      fail-fast: false
      matrix:
        part: [engine, vision]
    defaults:
      run:
        shell: bash
    steps:
      - name: build tools, and CUDA 13.0 Update 1 from NVIDIA's rhel8 repository
        run: |
          dnf install -y -q dnf-plugins-core
          dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf install -y -q --setopt=install_weak_deps=False gcc-toolset-13-gcc-c++ gcc-toolset-13-libstdc++-devel \
            binutils git python3.12 tar gzip findutils \
            cuda-nvcc-13-0-13.0.88-1 cuda-crt-13-0-13.0.88-1 libnvvm-13-0-13.0.88-1 libnvptxcompiler-13-0-13.0.88-1 \
            cuda-cudart-13-0-13.0.88-1 cuda-cudart-devel-13-0-13.0.88-1 cuda-driver-devel-13-0-13.0.88-1 \
            cuda-cccl-13-0-13.0.85-1 cuda-culibos-devel-13-0-13.0.85-1 libcublas-13-0-13.0.2.14-1 libcublas-devel-13-0-13.0.2.14-1
          echo /opt/rh/gcc-toolset-13/root/usr/bin >> "$GITHUB_PATH"
          /usr/local/cuda-13.0/bin/nvcc --version
      # the engine's remote stage is TLS 1.3, and a release build (STRATA_PORTABLE) links OpenSSL statically
      # (CMakeLists.txt strata_stage_tls); Rocky Linux 8's openssl-devel has the shared library only
      - name: OpenSSL 3.5.9 LTS, static, for the engine (Rocky Linux 8 has no static libssl)
        if: matrix.part == 'engine'
        run: |
          dnf install -y -q --setopt=install_weak_deps=False perl-core make curl
          v=3.5.9
          curl -fsSL -o /tmp/openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-$v/openssl-$v.tar.gz"
          echo "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  /tmp/openssl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd "/tmp/openssl-$v"
          ./Configure linux-x86_64 no-shared no-tests --prefix=/opt/openssl --libdir=lib --openssldir=/opt/openssl/ssl
          make -s -j"$(nproc)" build_libs
          make -s install_dev
          grep -m1 OPENSSL_FULL_VERSION_STR /opt/openssl/include/openssl/opensslv.h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cmake and ninja (requirements-build.txt's)
        run: |
          python3.12 -m venv /opt/venv
          /opt/venv/bin/pip install $(grep -E '^(cmake|ninja)==' requirements-build.txt | tr -d '\r')
          echo /opt/venv/bin >> "$GITHUB_PATH"
      - id: pins
        run: echo "llama=$(python3 -c 'import setup; print(setup.LLAMA_CPP_COMMIT)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/llama.cpp
          key: llama.cpp-${{ steps.pins.outputs.llama }}-linux
      - name: llama.cpp at setup.py's commit
        run: python3 -c "import setup; setup.get_llama_cpp()"
      - name: build ${{ matrix.part }}
        run: >-
          python3 .github/scripts/build_release.py ${{ matrix.part }} --build build --cuda /usr/local/cuda-13.0
          --llama third_party/llama.cpp --archs "75-real;86-real;89-real;120"
          ${{ matrix.part == 'engine' && '-D OPENSSL_ROOT_DIR=/opt/openssl' || '' }}
      - name: what it needs (libraries, glibc 2.28 at most, no libstdc++ / libgcc_s)
        run: |
          bad=0
          for f in build/strata build/libstrata_kq.so build/bin/strata-vision; do
            [ -f "$f" ] || continue
            needed=$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | tr '\n' ' ')
            glibc=$(readelf -V --wide "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
            echo "$f: $needed"
            echo "  newest glibc symbol: $glibc"
            case " $needed" in *" libstdc++.so"* | *" libgcc_s.so"*) echo "::error::$f needs the system's C++ runtime"; bad=1 ;; esac
            case "$f $needed" in */strata-vision*) ;; *" libcuda.so"*) echo "::error::$f needs the driver's libcuda"; bad=1 ;; esac
            if readelf -V --wide "$f" | grep -qE 'GLIBCXX_|CXXABI_|GCC_[0-9]'; then
              echo "::error::$f needs libstdc++ / libgcc_s symbol versions"; bad=1
            fi
            if [ "$(printf '%s\n' GLIBC_2.28 "$glibc" | sort -V | tail -1)" != GLIBC_2.28 ]; then
              echo "::error::$f needs $glibc, newer than Rocky Linux 8's 2.28"; bad=1
            fi
          done
          ls -l build/strata build/libstrata_kq.so build/bin/strata-vision 2>/dev/null || true
          exit $bad
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux-cuda13-${{ matrix.part }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/strata
            build/libstrata_kq.so
            build/bin/strata-vision
            build/CMakeCache.txt
            build/CMakeFiles/*/CMakeCUDACompiler.cmake

  pack:
    name: zips and SHA256.txt
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: parts
      - name: tools/make_release.py
        env:
          LINK: ${{ needs.version.outputs.link }}
        run: |
          for z in windows-cuda13 windows-cuda12 linux-cuda13; do
            python3 tools/make_release.py --platform "${z%%-*}" --link "$LINK" \
              --engine "parts/build-$z-engine" --vision "parts/build-$z-vision" --out dist
          done
          ls -l dist
          (cd dist && sha256sum -c SHA256.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.version.outputs.link }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: dist/

  linux-floor:
    name: the Linux zip on old distributions
    needs: [version, pack]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.version.outputs.link }}
          path: dist
      - name: strata --version on Rocky Linux 8 / 9, Debian 11, Ubuntu 20.04, with setup.py's CUDA wheels
        run: |
          python3 -m pip install --disable-pip-version-check -q --no-deps --target "$RUNNER_TEMP/wheels" \
            $(python3 -c "import setup; print(' '.join(setup.CUDA_WHEELS))")
          unzip -q dist/strata-linux-x64.zip -d "$RUNNER_TEMP/zip"
          bash .github/scripts/linux_floor.sh "$RUNNER_TEMP/zip" "$RUNNER_TEMP/wheels/nvidia/cu13/lib" \
            rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6 \
            rockylinux/rockylinux:9.6@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe \
            debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9 \
            ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214

  tests:
    name: setup and serve tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q -r requirements.txt pytest==9.0.2
      # Deselected: three tests that fail on upstream main e88ee39d (0.2.0-beta) itself on Linux (Python 3.12,
      # 2026-10-20: Golden test_yes 25 and test_enter_for_every_question 23 subtests, the parallel download test;
      # this tree fails a subset of them: 20 + 20 and the download test). They are upstream's, not the fork's.
      # TdrPointer since 0.2.6: upstream's 0.2.5 docs set (ed4b4db4) rewrote docs/TROUBLESHOOTING.md without the
      # "Windows AMD: the driver resets" entry the test still looks for; v0.2.6 4b9e05a2 fails it the same way.
      - name: setup.py
        run: >-
          python -m pytest -q -p no:cacheprovider tools/test_setup*.py tools/test_make_release.py
          --deselect tools/test_setup_golden.py::Golden::test_yes
          --deselect tools/test_setup_golden.py::Golden::test_enter_for_every_question
          --deselect tools/test_setup_download.py::ParallelDownload::test_a_big_file_comes_over_several_connections
          --deselect tools/test_setup_amd.py::TdrPointer::test_setup_points_windows_gfx12_to_the_entry
      - name: serve
        run: python -m pytest -q -p no:cacheprovider serve

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, pack, linux-floor, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.version.outputs.link }}
          path: dist
      - name: the draft (published by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINK: ${{ needs.version.outputs.link }}
        run: |
          (cd dist && sha256sum -c SHA256.txt)
          # one release per tag: a draft left by an earlier run is not doubled (delete it first to build it again)
          have=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) draft=\(.draft)\"")
          if [ -n "$have" ]; then
            echo "::error::$GITHUB_REF_NAME already has a release ($have): delete it to make the draft again"; exit 1
          fi
          printf 'Strata Link %s, built by the release workflow from %s (run %s).\n\nSHA256.txt: the SHA-256 of each zip.\n' \
            "$LINK" "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Strata Link $LINK" --notes-file notes.md
